name: Build CallBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4' # قفل کردن نسخه روی 8.4 برای سازگاری با AGP 8.1

      - name: 🔐 Grant execute permission for gradlew
        run: |
          # اگر فایل gradlew وجود ندارد، آن را با نسخه 8.4 می‌سازیم
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: 🏗️ Build Debug APK
        run: |
          # اجرای بیلد با استفاده از wrapper (که نسخه 8.4 را تضمین می‌کند)
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallBridge-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 📊 List build outputs
        if: success()
        run: |
          echo "🎉 Build completed successfully!"
          echo "APK files found:"
          find app/build/outputs/apk -name "*.apk" -ls
