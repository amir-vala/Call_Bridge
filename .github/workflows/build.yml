name: Build CallBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Setup Android SDK (Manual)
        run: |
          # استفاده از Android SDK از پیش نصب‌شده در GitHub runner
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          
          # پذیرش لایسنس‌ها
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # نصب ابزارهای لازم
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" --channel=0 || true
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: 🔐 Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            # ساخت gradle wrapper اگر وجود ندارد
            gradle wrapper --gradle-version 8.0
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallBridge-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: 📊 List build outputs
        if: success()
        run: |
          echo "📦 Build completed successfully!"
          echo "APK files:"
          find app/build/outputs/apk -name "*.apk" -ls
